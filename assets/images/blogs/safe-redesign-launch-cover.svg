<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">Website redesign safe launch checklist</title><desc id="desc">An editorial illustration of a website launch control room with a completed checklist and a protected deployment path.</desc>
