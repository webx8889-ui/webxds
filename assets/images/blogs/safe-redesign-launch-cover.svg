    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9f4"/><stop offset="1" stop-color="#ffe1ca"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="25" stdDeviation="26" flood-opacity=".32"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="20"/></filter>
