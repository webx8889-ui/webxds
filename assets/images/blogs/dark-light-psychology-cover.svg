<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">Dark mode and light mode interface psychology</title><desc id="desc">Two contrasting mobile interfaces, one light and one dark, divided by a warm glowing eclipse.</desc>
