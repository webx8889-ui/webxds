<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
 <title id="title">A three-stage redesign launch runway</title><desc id="desc">A visual timeline showing before launch, launch window, and after launch tasks.</desc><defs><linearGradient id="a" x1="0" x2="1"><stop stop-color="#281b39"/><stop offset="1" stop-color="#15121c"/></linearGradient></defs>
 <rect width="1200" height="640" rx="28" fill="url(#a)"/><text x="72" y="92" fill="#fff" font-family="Arial, sans-serif" font-size="38" font-weight="800">A safe launch is a runway, not a button</text><text x="72" y="132" fill="#bcaec9" font-family="Arial, sans-serif" font-size="21">Prepare the conditions, protect the moment, and keep watching after take-off.</text>
 <path d="M145 393H1055" stroke="#694e81" stroke-width="12" stroke-linecap="round"/><path d="M145 393H560" stroke="#ff8b54" stroke-width="12" stroke-linecap="round"/><path d="M560 393H810" stroke="#ffd068" stroke-width="12" stroke-linecap="round"/><path d="M810 393H1055" stroke="#70d5a3" stroke-width="12" stroke-linecap="round"/>
 <g font-family="Arial, sans-serif"><g><circle cx="236" cy="393" r="48" fill="#ff7248"/><text x="216" y="403" fill="#fff" font-size="25" font-weight="800">01</text><text x="168" y="283" fill="#ffb08f" font-size="25" font-weight="800">BEFORE</text><text x="136" y="474" fill="#fff" font-size="21">Freeze scope</text><text x="136" y="505" fill="#bcaec9" font-size="18">Back up • test • map URLs</text></g><g><circle cx="600" cy="393" r="48" fill="#ffd068"/><text x="579" y="403" fill="#2c2137" font-size="25" font-weight="800">02</text><text x="529" y="283" fill="#ffe7a6" font-size="25" font-weight="800">LAUNCH</text><text x="513" y="474" fill="#fff" font-size="21">Deploy calmly</text><text x="490" y="505" fill="#bcaec9" font-size="18">Verify • redirect • observe</text></g><g><circle cx="962" cy="393" r="48" fill="#70d5a3"/><text x="941" y="403" fill="#173126" font-size="25" font-weight="800">03</text><text x="899" y="283" fill="#a7f1c6" font-size="25" font-weight="800">AFTER</text><text x="877" y="474" fill="#fff" font-size="21">Stabilise</text><text x="852" y="505" fill="#bcaec9" font-size="18">Monitor • learn • improve</text></g></g>
 <g fill="#fff" opacity=".16"><circle cx="104" cy="208" r="5"/><circle cx="1086" cy="164" r="8"/><circle cx="1112" cy="475" r="4"/><circle cx="80" cy="525" r="6"/></g>
</svg>
