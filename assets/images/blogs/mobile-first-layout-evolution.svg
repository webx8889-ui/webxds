<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title"><title id="title">Mobile-first layout evolution from one column to a wider grid</title><rect width="1200" height="720" fill="#101114"/><g font-family="Inter,Arial"><text x="80" y="92" fill="#fea800" font-size="18" font-weight="800" letter-spacing="3">RESPONSIVE EXECUTION</text><text x="80" y="150" fill="#fff" font-size="42" font-weight="800">Enhance the same idea.</text><text x="165" y="220" fill="#d7d7da" font-size="18" font-weight="800">MOBILE</text><text x="508" y="220" fill="#d7d7da" font-size="18" font-weight="800">TABLET</text><text x="865" y="220" fill="#d7d7da" font-size="18" font-weight="800">DESKTOP</text><g stroke="#64656a" stroke-width="3"><rect x="166" y="245" width="215" height="365" rx="24" fill="#1b1c21"/><rect x="500" y="245" width="295" height="365" rx="24" fill="#1b1c21"/><rect x="862" y="245" width="258" height="365" rx="24" fill="#1b1c21"/></g><g fill="#f4f1e8"><rect x="187" y="272" width="172" height="34" rx="8"/><rect x="187" y="326" width="172" height="105" rx="8" fill="#fea800"/><rect x="187" y="451" width="172" height="50" rx="8"/><rect x="187" y="520" width="172" height="50" rx="8"/></g><g><rect x="522" y="272" width="250" height="34" rx="8" fill="#f4f1e8"/><rect x="522" y="326" width="250" height="112" rx="8" fill="#fea800"/><rect x="522" y="458" width="118" height="112" rx="8" fill="#f4f1e8"/><rect x="654" y="458" width="118" height="112" rx="8" fill="#34353b"/></g><g><rect x="884" y="272" width="214" height="34" rx="8" fill="#f4f1e8"/><rect x="884" y="326" width="214" height="110" rx="8" fill="#fea800"/><rect x="884" y="456" width="101" height="114" rx="8" fill="#f4f1e8"/><rect x="998" y="456" width="100" height="114" rx="8" fill="#34353b"/></g><path d="M403 425h65m-18-18 18 18-18 18M817 425h24m-18-18 18 18-18 18" stroke="#fea800" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="670" fill="#a9aaaf" font-size="18">Keep content, hierarchy and actions consistent; use available space to improve scanning, not to invent a separate product.</text></g></svg>
