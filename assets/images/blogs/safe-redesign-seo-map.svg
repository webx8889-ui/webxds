<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
 <title id="title">SEO redirect map for a redesigned website</title><desc id="desc">Old URLs flow through a redirect map to their corresponding new URLs with no dead ends.</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff3e8"/><stop offset="1" stop-color="#ffe0c7"/></linearGradient></defs>
 <rect width="1200" height="640" rx="28" fill="url(#b)"/><text x="68" y="88" fill="#2b1b36" font-family="Arial, sans-serif" font-size="38" font-weight="800">Preserve the paths people already use</text><text x="68" y="128" fill="#745e75" font-family="Arial, sans-serif" font-size="21">A redirect map carries search equity and visitors to the new, relevant page.</text>
 <g font-family="Arial, sans-serif"><text x="108" y="205" fill="#7c5b70" font-size="19" font-weight="800" letter-spacing="2">OLD URLS</text><text x="508" y="205" fill="#7c5b70" font-size="19" font-weight="800" letter-spacing="2">REDIRECT</text><text x="834" y="205" fill="#7c5b70" font-size="19" font-weight="800" letter-spacing="2">NEW DESTINATIONS</text></g>
