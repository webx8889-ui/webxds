<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title"><title id="title">Choice architecture: from overload to clarity</title><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#17181e"/><stop offset="1" stop-color="#292a31"/></linearGradient><linearGradient id="o"><stop stop-color="#ffb13c"/><stop offset="1" stop-color="#ff6500"/></linearGradient></defs><rect width="1536" height="1024" fill="url(#b)"/><text x="112" y="130" fill="#fff" font-family="Arial" font-size="52" font-weight="700">Choice architecture reduces mental effort</text><text x="112" y="185" fill="#b6b6bd" font-family="Arial" font-size="25">Users move faster when an interface highlights the decision that matters now.</text><g transform="translate(112 275)"><text fill="#ff9860" font-family="Arial" font-size="25" font-weight="700">BEFORE · EVERYTHING COMPETES</text><rect y="40" width="580" height="540" rx="28" fill="#24252c" stroke="#5a5a65"/><rect x="42" y="84" width="496" height="54" rx="12" fill="#383a43"/><rect x="42" y="164" width="230" height="178" rx="18" fill="#353741"/><rect x="308" y="164" width="230" height="178" rx="18" fill="#353741"/><rect x="42" y="380" width="230" height="158" rx="18" fill="#353741"/><rect x="308" y="380" width="230" height="158" rx="18" fill="#353741"/><g fill="#d6d6d9"><rect x="70" y="111" width="145" height="11" rx="5"/><rect x="70" y="194" width="140" height="16" rx="8"/><rect x="336" y="194" width="140" height="16" rx="8"/><rect x="70" y="411" width="140" height="16" rx="8"/><rect x="336" y="411" width="140" height="16" rx="8"/></g><g fill="#92939c"><rect x="70" y="231" width="165" height="10" rx="5"/><rect x="70" y="258" width="130" height="10" rx="5"/><rect x="336" y="231" width="165" height="10" rx="5"/><rect x="336" y="258" width="130" height="10" rx="5"/><rect x="70" y="448" width="165" height="10" rx="5"/><rect x="336" y="448" width="165" height="10" rx="5"/></g></g><path d="M758 555h96" stroke="url(#o)" stroke-width="12" stroke-linecap="round"/><path d="M830 523l40 32-40 32" fill="none" stroke="#ff7b00" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(932 275)"><text fill="#ffb13c" font-family="Arial" font-size="25" font-weight="700">AFTER · ONE DECISION LEADS</text><rect y="40" width="492" height="540" rx="28" fill="#24252c" stroke="#5a5a65"/><rect x="42" y="84" width="408" height="54" rx="12" fill="#383a43"/><text x="42" y="208" fill="#fff" font-family="Arial" font-size="32" font-weight="700">Invite your team</text><text x="42" y="248" fill="#b6b6bd" font-family="Arial" font-size="20">Collaboration starts with one simple step.</text><rect x="42" y="290" width="408" height="100" rx="18" fill="#353741" stroke="#62636c"/><circle cx="84" cy="340" r="20" fill="url(#o)"/><rect x="122" y="326" width="158" height="14" rx="7" fill="#fff"/><rect x="122" y="353" width="214" height="10" rx="5" fill="#a3a4ac"/><rect x="42" y="426" width="184" height="56" rx="28" fill="url(#o)"/><text x="80" y="462" fill="#1e1e1e" font-family="Arial" font-size="20" font-weight="700">Send invite</text></g><text x="112" y="922" fill="#d9d9dd" font-family="Arial" font-size="27">Reduce options, group related actions, and make the primary next step unmistakable.</text></svg>
