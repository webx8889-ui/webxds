<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title"><title id="title">Progressive disclosure in a web app settings flow</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101116"/><stop offset="1" stop-color="#2b2c33"/></linearGradient><linearGradient id="orange"><stop stop-color="#ffbd3f"/><stop offset="1" stop-color="#ff6500"/></linearGradient></defs><rect width="1536" height="1024" fill="url(#bg)"/><text x="112" y="126" fill="#fff" font-family="Arial" font-size="52" font-weight="700">Progressive disclosure keeps complexity available—not overwhelming</text><text x="112" y="181" fill="#b9bac0" font-family="Arial" font-size="25">Show the essentials first. Reveal advanced controls only when the user asks for them.</text><g transform="translate(144 274)"><rect width="570" height="524" rx="30" fill="#202128" stroke="#5a5b66"/><text x="42" y="75" fill="#fff" font-family="Arial" font-size="30" font-weight="700">Create automation</text><text x="42" y="113" fill="#aaaab3" font-family="Arial" font-size="19">Start with what every user needs.</text><text x="42" y="180" fill="#e5e5e8" font-family="Arial" font-size="20" font-weight="700">When this happens</text><rect x="42" y="202" width="486" height="66" rx="14" fill="#343640"/><text x="66" y="243" fill="#fff" font-family="Arial" font-size="19">A task is assigned</text><path d="M486 228l12 12-12 12" fill="none" stroke="#f5f5f5" stroke-width="3"/><text x="42" y="336" fill="#e5e5e8" font-family="Arial" font-size="20" font-weight="700">Then do this</text><rect x="42" y="358" width="486" height="66" rx="14" fill="#343640"/><text x="66" y="399" fill="#fff" font-family="Arial" font-size="19">Send a notification</text><path d="M486 384l12 12-12 12" fill="none" stroke="#f5f5f5" stroke-width="3"/><rect x="42" y="462" width="246" height="20" rx="10" fill="#9a9ba5"/></g><path d="M770 520h110" stroke="url(#orange)" stroke-width="12" stroke-linecap="round"/><path d="M848 487l36 33-36 33" fill="none" stroke="#ff7e00" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(924 274)"><rect width="470" height="524" rx="30" fill="#202128" stroke="#ff8500"/><text x="40" y="70" fill="#ffb13c" font-family="Arial" font-size="18" font-weight="700">ADVANCED OPTIONS</text><text x="40" y="120" fill="#fff" font-family="Arial" font-size="29" font-weight="700">Fine-tune the behaviour</text><rect x="40" y="165" width="390" height="1" fill="#555762"/><text x="40" y="221" fill="#e5e5e8" font-family="Arial" font-size="19" font-weight="700">Delay before sending</text><rect x="40" y="243" width="390" height="56" rx="14" fill="#343640"/><text x="64" y="278" fill="#fff" font-family="Arial" font-size="18">Immediately</text><text x="40" y="361" fill="#e5e5e8" font-family="Arial" font-size="19" font-weight="700">Only when</text><rect x="40" y="383" width="390" height="56" rx="14" fill="#343640"/><text x="64" y="418" fill="#aaaab3" font-family="Arial" font-size="18">Add condition</text></g><text x="144" y="896" fill="#d9d9dd" font-family="Arial" font-size="27">The primary flow stays calm; the extra power appears exactly when it becomes relevant.</text></svg>
