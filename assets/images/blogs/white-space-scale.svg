<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">A practical spacing scale</title><desc id="desc">A visual guide to a four, eight, sixteen, twenty four and thirty two pixel spacing scale.</desc><rect width="1200" height="720" fill="#fffaf8"/><text x="90" y="110" font-family="Inter,Arial" font-size="42" font-weight="750" fill="#28232b">Build rhythm with a simple scale</text><text x="90" y="153" font-family="Inter,Arial" font-size="21" fill="#756d73">A small set of intentional gaps produces a calmer system.</text><g font-family="Inter,Arial" fill="#28232b"><text x="90" y="250" font-size="20" font-weight="700">04</text><text x="90" y="335" font-size="20" font-weight="700">08</text><text x="90" y="430" font-size="20" font-weight="700">16</text><text x="90" y="535" font-size="20" font-weight="700">24</text><text x="90" y="650" font-size="20" font-weight="700">32</text></g><g fill="#ef6b2c"><rect x="172" y="231" width="40" height="8" rx="4"/><rect x="172" y="309" width="80" height="16" rx="8"/><rect x="172" y="398" width="160" height="32" rx="16"/><rect x="172" y="493" width="240" height="48" rx="24"/><rect x="172" y="592" width="320" height="64" rx="32"/></g><g font-family="Inter,Arial" font-size="18" fill="#756d73"><text x="540" y="238">tight: icon to label</text><text x="540" y="324">compact: text inside a component</text><text x="540" y="422">default: related items</text><text x="540" y="527">comfortable: content groups</text><text x="540" y="634">generous: distinct sections</text></g><path d="M90 188h1020" stroke="#e6ddda" stroke-width="2"/></svg>
