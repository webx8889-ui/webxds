<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title"><title id="title">A mobile-first content priority stack</title><rect width="1200" height="720" fill="#101114"/><text x="80" y="100" fill="#fea800" font-family="Inter,Arial" font-size="18" font-weight="800" letter-spacing="3">MOBILE-FIRST CONTENT MODEL</text><text x="80" y="159" fill="#fff" font-family="Inter,Arial" font-size="42" font-weight="800">Put the decision first.</text><g font-family="Inter,Arial"><rect x="80" y="214" width="1040" height="118" rx="18" fill="#fea800"/><text x="120" y="261" fill="#1b1406" font-size="17" font-weight="800" letter-spacing="2">01 • PRIMARY DECISION</text><text x="120" y="302" fill="#1b1406" font-size="27" font-weight="800">What does a visitor need to do right now?</text><rect x="150" y="361" width="900" height="100" rx="18" fill="#24252b" stroke="#5c5d63"/><text x="190" y="402" fill="#fea800" font-size="16" font-weight="800" letter-spacing="2">02 • ESSENTIAL CONTEXT</text><text x="190" y="438" fill="#fff" font-size="24" font-weight="700">Explain value, cost, timing and trust.</text><rect x="220" y="490" width="760" height="82" rx="18" fill="#18191e" stroke="#414249"/><text x="260" y="526" fill="#bdbec4" font-size="15" font-weight="800" letter-spacing="2">03 • SUPPORTING DETAIL</text><text x="260" y="555" fill="#fff" font-size="20" font-weight="600">Add only when it helps the next step.</text><path d="M600 332v29M600 461v29" stroke="#fea800" stroke-width="4" stroke-dasharray="4 8"/></g><text x="80" y="650" fill="#a9aaaf" font-family="Inter,Arial" font-size="18">If the small screen is clear, the larger layout has a strong hierarchy to grow from.</text></svg>
