<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">The four WCAG POUR principles</title><desc id="d">Four cards explain perceivable, operable, understandable and robust web experiences.</desc><rect width="1200" height="720" fill="#121315"/><text x="72" y="104" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">The POUR framework</text><text x="72" y="142" fill="#b8b8b8" font-family="Arial,sans-serif" font-size="21">Every WCAG success criterion helps make content more perceivable, operable, understandable or robust.</text><g font-family="Arial,sans-serif"><g transform="translate(72 200)"><rect width="500" height="200" rx="20" fill="#22242a"/><circle cx="62" cy="64" r="32" fill="#fea800"/><path d="M44 64c20-25 40-25 60 0-20 25-40 25-60 0Zm30-12a12 12 0 1 0 0 24 12 12 0 0 0 0-24Z" fill="none" stroke="#17130c" stroke-width="5"/><text x="118" y="64" fill="#fff" font-size="28" font-weight="700">Perceivable</text><text x="118" y="99" fill="#c7c7c8" font-size="18">Give information in ways people can see,</text><text x="118" y="126" fill="#c7c7c8" font-size="18">hear or otherwise perceive.</text></g><g transform="translate(628 200)"><rect width="500" height="200" rx="20" fill="#22242a"/><circle cx="62" cy="64" r="32" fill="#ff7139"/><path d="M48 64h28m-14-14v28M90 49v30M100 49v30" fill="none" stroke="#1f1210" stroke-width="5" stroke-linecap="round"/><text x="118" y="64" fill="#fff" font-size="28" font-weight="700">Operable</text><text x="118" y="99" fill="#c7c7c8" font-size="18">Let people navigate, interact and complete</text><text x="118" y="126" fill="#c7c7c8" font-size="18">tasks with the input method they use.</text></g><g transform="translate(72 446)"><rect width="500" height="200" rx="20" fill="#22242a"/><circle cx="62" cy="64" r="32" fill="#55c8a0"/><path d="M46 52h32v24H46zM52 58h20m-20 8h14" stroke="#112118" stroke-width="4" fill="none" stroke-linecap="round"/><text x="118" y="64" fill="#fff" font-size="28" font-weight="700">Understandable</text><text x="118" y="99" fill="#c7c7c8" font-size="18">Use clear language and predictable, helpful</text><text x="118" y="126" fill="#c7c7c8" font-size="18">behaviour so people know what happens next.</text></g><g transform="translate(628 446)"><rect width="500" height="200" rx="20" fill="#22242a"/><circle cx="62" cy="64" r="32" fill="#9b8cff"/><path d="M47 75l15-30 15 30m-24-12h18M88 50v27m-9-20h18" stroke="#18142e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="118" y="64" fill="#fff" font-size="28" font-weight="700">Robust</text><text x="118" y="99" fill="#c7c7c8" font-size="18">Build valid, semantic foundations that work</text><text x="118" y="126" fill="#c7c7c8" font-size="18">with browsers and assistive technology.</text></g></g></svg>
