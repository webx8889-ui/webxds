<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Continuous accessibility testing loop</title><desc id="d">A circular process shows design, build, test with people, fix and monitor.</desc><rect width="1200" height="720" fill="#101115"/><text x="72" y="100" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Build accessibility into the delivery loop</text><text x="72" y="140" fill="#b6b6b8" font-family="Arial,sans-serif" font-size="20">Automated checks catch patterns. Human testing reveals whether the experience actually works.</text><g transform="translate(600 409)" fill="none" stroke-linecap="round"><circle r="180" stroke="#34363d" stroke-width="42"/><path d="M-120-133A180 180 0 0 1 130-124" stroke="#fea800" stroke-width="42"/><path d="M144-107A180 180 0 0 1 112 141" stroke="#ff7139" stroke-width="42"/><path d="M93 154A180 180 0 0 1-151 93" stroke="#55c8a0" stroke-width="42"/><path d="M-163 74A180 180 0 0 1-141-109" stroke="#9b8cff" stroke-width="42"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><circle cx="600" cy="409" r="94" fill="#1e2026"/><text x="600" y="401" fill="#fff" font-size="27" font-weight="700">ACCESSIBLE</text><text x="600" y="434" fill="#fea800" font-size="22" font-weight="700">BY DESIGN</text><text x="600" y="205" fill="#fff" font-size="23" font-weight="700">1. Design</text><text x="600" y="233" fill="#c8c8ca" font-size="16">plan inclusive patterns</text><text x="890" y="346" fill="#fff" font-size="23" font-weight="700">2. Build</text><text x="890" y="374" fill="#c8c8ca" font-size="16">use semantic components</text><text x="814" y="633" fill="#fff" font-size="23" font-weight="700">3. Test</text><text x="814" y="661" fill="#c8c8ca" font-size="16">keyboard + assistive tech</text><text x="345" y="633" fill="#fff" font-size="23" font-weight="700">4. Fix</text><text x="345" y="661" fill="#c8c8ca" font-size="16">prioritise task blockers</text><text x="300" y="346" fill="#fff" font-size="23" font-weight="700">5. Monitor</text><text x="300" y="374" fill="#c8c8ca" font-size="16">protect quality in releases</text></g></svg>
