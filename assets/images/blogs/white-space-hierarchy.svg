<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">White space establishes hierarchy</title><desc id="desc">A clean landing page wireframe uses space to lead attention from headline to action.</desc><rect width="1200" height="720" fill="#1c1821"/><rect x="115" y="74" width="970" height="572" rx="26" fill="#fffaf8"/><rect x="155" y="114" width="890" height="22" rx="11" fill="#eae3e1"/><circle cx="174" cy="125" r="6" fill="#ed6d2d"/><rect x="155" y="198" width="360" height="33" rx="16" fill="#28232b"/><rect x="155" y="250" width="450" height="16" rx="8" fill="#aaa2a5"/><rect x="155" y="279" width="384" height="16" rx="8" fill="#c8c0c1"/><rect x="155" y="332" width="158" height="52" rx="26" fill="#ee6b2b"/><rect x="155" y="446" width="210" height="1" fill="#ded6d4"/><rect x="155" y="478" width="120" height="14" rx="7" fill="#28232b"/><rect x="155" y="506" width="230" height="10" rx="5" fill="#b6adae"/><rect x="155" y="526" width="186" height="10" rx="5" fill="#d7cdcd"/><rect x="695" y="191" width="300" height="318" rx="25" fill="#f6d4c5"/><circle cx="845" cy="350" r="104" fill="#ed6b2b"/><path d="M808 350h74M845 313v74" stroke="#fffaf8" stroke-width="12" stroke-linecap="round"/><path d="M604 258h62M604 358h62M390 475h244" stroke="#f2a680" stroke-width="2" stroke-dasharray="8 8"/><text x="155" y="584" font-family="Inter,Arial" font-size="18" fill="#8d8588">A clear gap tells the eye: this is a new idea.</text></svg>
