<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title"><title id="title">Mobile-first release loop</title><rect width="1200" height="720" fill="#101114"/><g font-family="Inter,Arial"><text x="80" y="96" fill="#fea800" font-size="18" font-weight="800" letter-spacing="3">A REPEATABLE DELIVERY LOOP</text><text x="80" y="154" fill="#fff" font-size="42" font-weight="800">Design. Build. Measure. Improve.</text><circle cx="600" cy="415" r="150" fill="none" stroke="#36373d" stroke-width="30"/><path d="M600 265a150 150 0 0 1 142 104" fill="none" stroke="#fea800" stroke-width="30"/><path d="M742 369a150 150 0 0 1-68 172" fill="none" stroke="#fff" stroke-width="30"/><path d="M674 541a150 150 0 0 1-187-21" fill="none" stroke="#777982" stroke-width="30"/><path d="M487 520a150 150 0 0 1-29-167" fill="none" stroke="#d8d1c6" stroke-width="30"/><text x="530" y="408" fill="#fff" font-size="23" font-weight="800">REAL USE</text><text x="514" y="441" fill="#c9c9cd" font-size="17">drives the next pass</text><g font-size="21" font-weight="800"><text x="160" y="305" fill="#fea800">01</text><text x="160" y="337" fill="#fff">Prioritise the task</text><text x="854" y="305" fill="#fea800">02</text><text x="854" y="337" fill="#fff">Build the smallest path</text><text x="854" y="548" fill="#fea800">03</text><text x="854" y="580" fill="#fff">Test on real devices</text><text x="160" y="548" fill="#fea800">04</text><text x="160" y="580" fill="#fff">Learn from behaviour</text></g></g></svg>
