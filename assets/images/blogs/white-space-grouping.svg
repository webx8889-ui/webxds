<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Spacing creates visual groups</title><desc id="desc">Two interface layouts show the difference between crowded and grouped content.</desc><defs><filter id="s" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="15" stdDeviation="16" flood-opacity=".18"/></filter></defs><rect width="1200" height="720" fill="#f5f1ef"/><text x="70" y="80" font-family="Inter,Arial" font-size="30" font-weight="700" fill="#25212b">Spacing makes relationships visible</text><text x="70" y="116" font-family="Inter,Arial" font-size="18" fill="#716b73">Same content. Two radically different reading experiences.</text><g filter="url(#s)"><rect x="70" y="165" width="480" height="465" rx="24" fill="#fff"/><rect x="650" y="165" width="480" height="465" rx="24" fill="#fff"/></g><text x="110" y="218" font-family="Inter,Arial" font-size="18" font-weight="700" fill="#ad4821">CROWDED</text><text x="690" y="218" font-family="Inter,Arial" font-size="18" font-weight="700" fill="#17775c">GROUPED</text><g fill="#322c37"><rect x="110" y="263" width="215" height="18" rx="9"/><rect x="110" y="298" width="354" height="11" rx="5" fill="#9d979e"/><rect x="110" y="321" width="289" height="11" rx="5" fill="#c7c1c5"/><rect x="110" y="355" width="134" height="42" rx="21" fill="#f06b2b"/><rect x="110" y="415" width="215" height="18" rx="9"/><rect x="110" y="450" width="354" height="11" rx="5" fill="#9d979e"/><rect x="110" y="473" width="289" height="11" rx="5" fill="#c7c1c5"/><rect x="110" y="507" width="134" height="42" rx="21" fill="#f06b2b"/></g><g><rect x="690" y="262" width="400" height="145" rx="16" fill="#fff3ed"/><rect x="720" y="290" width="215" height="18" rx="9" fill="#322c37"/><rect x="720" y="325" width="310" height="11" rx="5" fill="#9d979e"/><rect x="720" y="348" width="254" height="11" rx="5" fill="#c7c1c5"/><rect x="720" y="370" width="134" height="10" rx="5" fill="#f06b2b"/><rect x="690" y="457" width="400" height="145" rx="16" fill="#f0faf7"/><rect x="720" y="485" width="215" height="18" rx="9" fill="#322c37"/><rect x="720" y="520" width="310" height="11" rx="5" fill="#9d979e"/><rect x="720" y="543" width="254" height="11" rx="5" fill="#c7c1c5"/><rect x="720" y="565" width="134" height="10" rx="5" fill="#1f8c6e"/></g></svg>
